# =============================================================================
# Basil Capture - SenseCAP Indicator D1 Status Display (ESPHome)
# =============================================================================
# Subscribes to the MQTT topics published by the Basil Capture Pi service and
# shows the current status on the 4" LVGL screen.
#
# Topics (must match pi/config.yaml -> mqtt):
#   basil/capture/status        JSON: {status,title,body,ts}
#   basil/capture/availability  "online" / "offline"  (LWT from the Pi)
#
# Status -> color:  success=green  error=red  scanning=blue  idle=grey
# The title ("Error", "Undone", ...) is always bold; the body text is regular.
#
# Offline screen: shown when the Pi is unavailable ("waiting for scanner...")
# or when the Indicator itself loses the MQTT broker ("can't reach server...").
#
# Screen sleep: the backlight turns off after the Settings page's "Screen
# timeout" of quiet (15 s - 10 min, or Never; default 1 min) and wakes on a
# scan, a touch, or the top user button (GPIO38). It stays on for as long as a
# scanning/success/error screen is showing.
#
# Settings + undo: while idle a settings gear (Material icon) sits top-right. It
# opens a page with two sliders: how long result screens stay up (2-10 s, same
# as the Basil app's Auto-Reset Delay) and the screen timeout. Both live in
# flash; the result time is also published retained so the Pi follows it. After a
# successful scan the same slot shows an undo arrow for as long as that result is
# up; tapping it sends the scan's transaction id to the Pi, which asks Grocy to
# undo it.
#
# First flash over USB-C (bottom port); afterwards OTA.
# =============================================================================

substitutions:
  name: basil-capture-indicator
  friendly_name: Basil Capture Indicator
  # After power-on, how long to show "Starting Up" while waiting for the Pi's
  # live "ready" before giving up and showing the offline screen. Covers the
  # Pi booting at the same time as the Indicator (e.g. after a power cut).
  startup_grace: 90s
  # Back-channel topics (Indicator -> Pi). Must match pi/config.yaml -> mqtt;
  # these are also the defaults the Pi uses when the keys are absent.
  undo_topic: basil/capture/undo
  result_sec_topic: basil/capture/settings/result_sec
  # Pi -> Indicator, NOT retained: "my scanner is open". Ends Starting Up.
  ready_topic: basil/capture/ready
  # --- Basil brand palette (matched to the app) ---
  color_bg: "0x5A3A4E"        # deep purple body
  color_bg_dark: "0x3A2130"   # darker header/offline purple
  color_success: "0x6FB06B"   # Basil mint-forward green (readable on dark)
  color_error: "0xC0392B"     # error red
  color_scanning: "0x8E6C88"  # muted purple-lavender for "looking up"
  color_bracket: "0xC9B8C4"   # scanner reticle lavender-grey
  color_text: "0xFFFFFF"      # primary white text
  color_text_dim: "0xC9B8C4"  # secondary lavender-grey text (dark bgs only)
  color_badge_text: "0x3A2130" # numeral inside the white stock badge

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  # Run the same refresh logic at boot so the "Starting Up" screen is laid out
  # exactly as refresh_screen draws it. priority -100 runs late: ESPHome holds
  # boot here until Wi-Fi and MQTT have connected, so until then the static LVGL
  # layout (also "Starting Up") is what's shown. The short delay lets the first
  # LVGL layout pass settle before we re-align.
  on_boot:
    priority: -100
    then:
      - delay: 500ms
      - lambda: 'ESP_LOGI("basil", "Booted - waiting for first status message");'
      - script.execute: refresh_screen
      # Start the sleep countdown so the screen doesn't stay lit forever if no
      # status message ever arrives.
      - script.execute: screen_sleep
      # Bound how long Starting Up can last if the Pi never checks in.
      - script.execute: startup_timeout
      # Ask a Pi that's already up for a fresh "ready". The birth message does
      # the same, but it can go out before our subscription to ${ready_topic}
      # is active, so the reply would be missed. By on_boot we're subscribed.
      - mqtt.publish:
          topic: basil/capture/indicator/availability
          payload: online
          retain: true
      # Clamp the stored setting into the slider's 2-10 s range: a value saved
      # under the old 3-30 s range would otherwise be published to the Pi as-is.
      - lambda: |-
          if (id(result_sec_setting) < 2)  id(result_sec_setting) = 2;
          if (id(result_sec_setting) > 10) id(result_sec_setting) = 10;
      # Restore the stored setting into the Settings page's slider and label.
      - lvgl.slider.update:
          id: settings_slider
          value: !lambda 'return id(result_sec_setting);'
      - lvgl.label.update:
          id: lbl_setting_value
          text:
            format: "%d s"
            args: ['id(result_sec_setting)']
      # Same for the screen timeout (an index into the presets in screen_sleep).
      - lambda: |-
          if (id(screen_timeout_idx) < 0) id(screen_timeout_idx) = 0;
          if (id(screen_timeout_idx) > 6) id(screen_timeout_idx) = 6;
      - lvgl.slider.update:
          id: timeout_slider
          value: !lambda 'return id(screen_timeout_idx);'
      - lvgl.label.update:
          id: lbl_timeout_value
          text: !lambda |-
            static const char* const names[] = {"15 s", "30 s", "1 min", "2 min", "5 min", "10 min", "Never"};
            return std::string(names[id(screen_timeout_idx)]);

# ESP32-S3 with octal PSRAM. The display will NOT initialize without PSRAM
# configured correctly - this is the usual cause of a black/backlight-off screen.
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

# Basil sprig logo (full-color, source is 804x615). RGB565 + alpha_channel
# keeps the PNG's anti-aliased transparency instead of flattening to one
# color, so no image_recolor is applied when it's drawn.
image:
  - platform: file
    file: basil_logo.png
    id: basil_leaf
    resize: 63x48
    type: RGB565
    transparency: alpha_channel

# Bold weight for the screen title (lbl_title). LVGL's built-in montserrat_*
# fonts only come in one weight, so this one is pulled from Google Fonts at
# compile time. glyphs is all of printable ASCII on purpose: any character
# missing here renders as a blank.
font:
  - file:
      type: gfonts
      family: Montserrat
      weight: 700
    id: font_bold_28
    size: 28
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  # Material icons for the header buttons, pulled from Google Fonts at compile
  # time (first build downloads the font; ESPHome caches it afterwards). Only
  # the two glyphs we draw are kept, so it costs almost nothing in flash.
  #   e8b8 = settings (gear)    e166 = undo
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_icons
    size: 32
    bpp: 4
    glyphs: ["\U0000e8b8", "\U0000e166"]

ota:
  - platform: esphome

# --- MQTT: subscribe to the Pi's status topics ------------------------------
# No native HA "api:" block on purpose - the Indicator is driven purely by the
# Pi's MQTT messages, keeping it decoupled from HA internals.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  birth_message:
    topic: basil/capture/indicator/availability
    payload: online
  will_message:
    topic: basil/capture/indicator/availability
    payload: offline

  # Our own link to the broker. Without these the last screen (usually "Ready
  # to Scan") just stays up when the broker goes away, since nothing new can
  # arrive to change it. On reconnect ESPHome resubscribes and the broker
  # replays the retained status/availability, so the screen catches up.
  on_connect:
    - lambda: |-
        if (!id(broker_up)) ESP_LOGI("basil", "MQTT broker connected");
        id(broker_up) = true;
    - script.execute: refresh_screen
  on_disconnect:
    - lambda: |-
        if (id(broker_up)) ESP_LOGW("basil", "MQTT broker disconnected");
        id(broker_up) = false;
    - script.execute: refresh_screen
    # Wake the screen so the outage is seen, but not during startup, where
    # the Starting Up screen already says we're connecting.
    - if:
        condition:
          lambda: 'return !id(starting_up);'
        then:
          - light.turn_on: backlight
          - script.execute: screen_sleep

  on_json_message:
    - topic: basil/capture/status
      then:
        # Update all three values first, THEN redraw once - so the color and
        # text always change together in a single frame.
        # Every field is converted to std::string explicitly. Passing the raw
        # JSON value stopped compiling in ESPHome 2026.10, which added a
        # `const char*` overload of publish_state() next to the std::string one.
        #
        # `| ""` defaults the field when it's absent, so a retained message
        # published by an older Pi build (which had no "badge" key) still
        # renders instead of feeding garbage to the label.
        - text_sensor.template.publish:
            id: scan_status
            state: !lambda 'return std::string(x["status"] | "");'
        - text_sensor.template.publish:
            id: scan_title
            state: !lambda 'return std::string(x["title"] | "");'
        - text_sensor.template.publish:
            id: scan_body
            state: !lambda 'return std::string(x["body"] | "");'
        - text_sensor.template.publish:
            id: scan_badge
            state: !lambda 'return std::string(x["badge"] | "");'
        # Transaction id of the scan the Pi can undo ("" when none). It is a
        # string on purpose: `| ""` only returns a string field, and Grocy's
        # transaction ids are strings anyway.
        - text_sensor.template.publish:
            id: scan_undo_id
            state: !lambda 'return std::string(x["undo_id"] | "");'
        # How long the Pi will leave this screen up. 0 on screens that don't
        # time out, which is what hides the countdown bar.
        - lambda: 'id(result_ms) = x["timeout_ms"] | 0;'
        - lambda: |-
            ESP_LOGI("basil", "MQTT status: %s | title='%s' body='%s' badge='%s' timeout=%dms",
                     id(scan_status).state.c_str(), id(scan_title).state.c_str(),
                     id(scan_body).state.c_str(), id(scan_badge).state.c_str(),
                     id(result_ms));
        - script.execute: refresh_screen
        # Wake the backlight for any active status (scanning/success/error).
        # An "idle" message deliberately does NOT wake a dark screen - it only
        # (re)starts the sleep countdown below.
        - if:
            condition:
              lambda: 'return id(scan_status).state != "idle" && !id(scan_status).state.empty();'
            then:
              - light.turn_on: backlight
              # A scan result takes over from the Settings page if it's open.
              - lvgl.page.show: main_page
        # Offer Undo only while the result is up: hide the button when the
        # countdown ends, even if the Pi's idle message never arrives.
        - if:
            condition:
              lambda: 'return !id(scan_undo_id).state.empty() && id(result_ms) > 0;'
            then:
              - script.execute: undo_expire
        - script.execute: screen_sleep

  on_message:
    - topic: basil/capture/availability
      then:
        - lambda: |-
            bool now_online = (x == "online");
            if (now_online != id(pi_online)) {
              ESP_LOGI("basil", "Pi availability: %s -> %s",
                       id(pi_online) ? "online" : "offline",
                       now_online ? "online" : "offline");
            } else {
              ESP_LOGD("basil", "Pi availability unchanged: %s", x.c_str());
            }
            id(pi_online) = now_online;
            // A retained "online" does NOT end Starting Up: after a power cut
            // it's stale until the broker's keepalive check publishes the
            // Pi's LWT. Only the live message on ${ready_topic} does.
        - script.execute: refresh_screen
        # Wake the screen when the Pi drops offline so the "offline" notice is
        # actually seen; it goes back to sleep after the screen timeout. Not during
        # startup, where "offline" is just the Pi's stale retained LWT.
        - if:
            condition:
              lambda: 'return !id(pi_online) && !id(starting_up);'
            then:
              - light.turn_on: backlight
        # Whenever the Pi comes online (including the retained "online" we get
        # right after our own connect), hand it the on-device setting so it
        # never runs on a stale value.
        - if:
            condition:
              lambda: 'return id(pi_online);'
            then:
              - mqtt.publish:
                  topic: ${result_sec_topic}
                  payload: !lambda 'return std::to_string(id(result_sec_setting));'
                  retain: true
        - script.execute: screen_sleep

    # Live (never retained) "ready" from the Pi, sent once its scanner is open
    # and again whenever we connect. This is what ends the Starting Up screen.
    - topic: ${ready_topic}
      then:
        - lambda: |-
            if (id(starting_up)) ESP_LOGI("basil", "Pi ready - startup complete");
            id(starting_up) = false;
            id(pi_online) = true;
            id(broker_up) = true;  // a message arrived, so we're connected
        - script.execute: refresh_screen
        - script.execute: screen_sleep

globals:
  - id: pi_online
    type: bool
    restore_value: no
    initial_value: "true"
  # True from power-on until the Pi sends its live "ready" (or startup_grace
  # runs out). While set, refresh_screen shows the Starting Up screen.
  - id: starting_up
    type: bool
    restore_value: no
    initial_value: "true"
  # Whether we're connected to the MQTT broker right now (see mqtt:
  # on_connect / on_disconnect). While false, the offline screen shows.
  - id: broker_up
    type: bool
    restore_value: no
    initial_value: "false"
  - id: result_ms
    type: int
    restore_value: no
    initial_value: "0"
  # Seconds a result screen stays up (and how long Undo is offered). Set from
  # the Settings page; kept in flash. The Pi's config.yaml value is only used
  # until this is published.
  - id: result_sec_setting
    type: int
    restore_value: yes
    initial_value: "5"
  # Screen timeout, as an index into the presets in screen_sleep:
  # 0=15 s  1=30 s  2=1 min  3=2 min  4=5 min  5=10 min  6=Never. Kept in flash.
  - id: screen_timeout_idx
    type: int
    restore_value: yes
    initial_value: "2"

text_sensor:
  - platform: template
    id: scan_status
  - platform: template
    id: scan_title
  - platform: template
    id: scan_body
  - platform: template
    id: scan_badge
  - platform: template
    id: scan_undo_id

# --- Display stack ----------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO39
    scl: GPIO40
    scan: false

# SPI bus used to send the display's init sequence at boot. Required by the
# mipi_rgb driver even though pixel data runs over the parallel RGB bus.
spi:
  - id: lcd_spi
    clk_pin: GPIO41
    mosi_pin: GPIO48
    miso_pin: GPIO47

pca9554:
  - id: pca9554a_device
    address: 0x20
    pin_count: 16
    i2c_id: bus_a

display:
  - platform: mipi_rgb
    model: SEEED-INDICATOR-D1
    id: sensecap_display
    update_interval: never
    auto_clear_enabled: false

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: backlight_output
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    frequency: 100Hz

# --- Touch + screen wake inputs ---------------------------------------------
# LVGL picks this touchscreen up automatically: with a single touchscreen no
# `touchscreens:` entry is needed under lvgl:. Every release also wakes the
# backlight. The mirror transform is the one the ESPHome device page uses for
# this board; it has to match the display so taps land on the buttons. If taps
# land on the opposite side of the screen, flip these.
touchscreen:
  - platform: ft5x06
    id: sensecap_touchscreen
    transform:
      mirror_x: true
      mirror_y: true
    on_release:
      then:
        - light.turn_on: backlight
        - script.execute: screen_sleep

# User button on top of the unit (GPIO38, normally high, so inverted).
# internal: true keeps it out of MQTT discovery / Home Assistant.
binary_sensor:
  - platform: gpio
    id: user_button
    name: "User Button"
    internal: true
    pin:
      number: GPIO38
      inverted: true
    on_press:
      then:
        - light.turn_on: backlight
        - script.execute: screen_sleep

# --- LVGL UI ----------------------------------------------------------------
lvgl:
  displays:
    - sensecap_display
  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - obj:
            id: bg_panel
            x: 0
            y: 0
            width: 480
            height: 480
            radius: 0
            bg_color: ${color_bg}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            widgets:
              # --- Header banner (darker purple, Basil + leaf) ---
              - obj:
                  id: header_bar
                  x: 0
                  y: 0
                  width: 480
                  height: 72
                  radius: 0
                  bg_color: ${color_bg_dark}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - label:
                        id: lbl_brand
                        text: "Basil"
                        x: 24
                        align: LEFT_MID
                        text_color: ${color_text}
                        text_font: montserrat_28
                    - image:
                        id: img_leaf
                        src: basil_leaf
                        x: 128
                        align: LEFT_MID
                    # Top-right slot: "Settings" while idle, "Undo" after a
                    # scan that can be undone - never both (refresh_screen
                    # decides). Both start hidden; the boot refresh shows the
                    # right one. Each is a 56x56 touch target around a 32 px icon.
                    - button:
                        id: btn_settings
                        hidden: true
                        align: RIGHT_MID
                        x: -12
                        width: 56
                        height: 56
                        radius: 28
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        on_click:
                          then:
                            - lvgl.page.show: settings_page
                            - script.execute: settings_autoclose
                        widgets:
                          - label:
                              text: "\U0000e8b8"   # settings
                              align: CENTER
                              text_color: ${color_text}
                              text_font: font_icons
                    - button:
                        id: btn_undo
                        hidden: true
                        align: RIGHT_MID
                        x: -12
                        width: 56
                        height: 56
                        radius: 28
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        on_click:
                          then:
                            - mqtt.publish:
                                topic: ${undo_topic}
                                payload: !lambda 'return id(scan_undo_id).state;'
                            # Hide at once so a second tap can't send it twice.
                            - lambda: 'lv_obj_add_flag(id(btn_undo), LV_OBJ_FLAG_HIDDEN);'
                        widgets:
                          - label:
                              text: "\U0000e166"   # undo
                              align: CENTER
                              text_color: ${color_text}
                              text_font: font_icons
              # --- Scanner reticle: four corner brackets (Basil motif) ---
              # Frame ~340w x 200h centered in the body, with "Ready to Scan"
              # sitting inside it. Bar length 60, thickness 8.
              # Frame edges: left x=70, right corner x=410, top y=176, bottom y=376
              # Top-left
              - obj:
                  id: br_tl_h
                  hidden: true
                  x: 60
                  y: 159
                  width: 64
                  height: 8
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              - obj:
                  id: br_tl_v
                  hidden: true
                  x: 60
                  y: 159
                  width: 8
                  height: 64
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              # Top-right
              - obj:
                  id: br_tr_h
                  hidden: true
                  x: 356
                  y: 159
                  width: 64
                  height: 8
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              - obj:
                  id: br_tr_v
                  hidden: true
                  x: 412
                  y: 159
                  width: 8
                  height: 64
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              # Bottom-left
              - obj:
                  id: br_bl_h
                  hidden: true
                  x: 60
                  y: 361
                  width: 64
                  height: 8
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              - obj:
                  id: br_bl_v
                  hidden: true
                  x: 60
                  y: 305
                  width: 8
                  height: 64
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              # Bottom-right
              - obj:
                  id: br_br_h
                  hidden: true
                  x: 356
                  y: 361
                  width: 64
                  height: 8
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              - obj:
                  id: br_br_v
                  hidden: true
                  x: 412
                  y: 305
                  width: 8
                  height: 64
                  radius: 0
                  bg_color: ${color_bracket}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              # --- Text (centered inside the bracket frame) ---
              # Title + body live in a SIZE_CONTENT flex column, NOT at fixed y
              # offsets. Fixed offsets anchored each label's *center*, so a body
              # that wrapped to two lines grew upward into the title and drew on
              # top of it. Flex stacks them instead: the body can be any number
              # of lines and simply pushes the column taller.
              #
              # Only the container is re-aligned in refresh_screen - never these
              # two labels. lv_obj_align() on a flex child is overridden by the
              # layout engine, which is what made the previous realign approach
              # incompatible with flex.
              - obj:
                  id: status_group
                  align: CENTER
                  y: 24
                  width: 440
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    # Gap between every row: title / product name / stock pill.
                    # The column is SIZE_CONTENT and re-centered on each update,
                    # so widening this spends the screen's spare vertical room
                    # symmetrically instead of pushing the block off-center.
                    pad_row: 24
                  widgets:
                    # The static (pre-boot) state of every widget below is the
                    # "Starting Up" screen. on_boot doesn't run until Wi-Fi and
                    # MQTT have connected, so this layout is what's on the glass
                    # for those first seconds - it must not claim to be ready.
                    - label:
                        id: lbl_title
                        text: "Starting Up"
                        width: 440
                        long_mode: WRAP
                        text_align: CENTER
                        text_color: ${color_text}
                        text_font: font_bold_28
                    # Only shown on the Starting Up screen.
                    - spinner:
                        id: boot_spinner
                        width: 56
                        height: 56
                        spin_time: 1200ms
                        arc_length: 60deg
                        arc_width: 6
                        arc_color: ${color_bg_dark}
                        indicator:
                          arc_width: 6
                          arc_color: ${color_text}
                    - label:
                        id: lbl_body
                        text: ""
                        hidden: true
                        width: 440
                        long_mode: WRAP
                        text_align: CENTER
                        text_color: ${color_text}
                        text_font: montserrat_28
                    # Stock badge: the remaining count as a numeral in a solid
                    # white pill. radius = half the HEIGHT gives fully round
                    # ends at any width, so SIZE_CONTENT lets it grow from "3"
                    # to "12" to "Last available" and stay a proper tic-tac
                    # rather than a circle that clips or a rectangle with
                    # rounded corners. Fitting text is why the emptied-shelf
                    # note lives in here instead of in a row of its own.
                    #
                    # The side padding is what keeps a single digit from
                    # rendering narrower than it is tall. The dark numeral on
                    # white is what makes this legible against every status
                    # background - the dim-lavender text it replaced washed
                    # out badly on the success green.
                    - obj:
                        id: stock_badge
                        # Hidden until a result has a count. Visible-but-empty it
                        # renders as a bare white dot under the title.
                        hidden: true
                        width: SIZE_CONTENT
                        height: 44
                        radius: 22
                        bg_color: ${color_text}
                        bg_opa: COVER
                        border_width: 0
                        pad_top: 0
                        pad_bottom: 0
                        pad_left: 20
                        pad_right: 20
                        widgets:
                          - label:
                              id: lbl_badge
                              text: ""
                              align: CENTER
                              text_align: CENTER
                              text_color: ${color_badge_text}
                              # A size down from the product name on purpose:
                              # at montserrat_28 the pill matched the name's
                              # weight and competed with it for attention.
                              text_font: montserrat_20
              # Countdown bar: drains right-to-left over exactly the span the
              # Pi says it will leave this screen up. Sits flush under the
              # header, so y matches header_bar's height - move one and the
              # other has to follow.
              #
              # Anchored TOP_LEFT so shrinking the width pulls the right edge in
              # from a fixed left edge; a centered anchor would close in from
              # both sides.
              #
              # Deliberately NOT a child of status_group - anything in that flex
              # column reflows the text every animation frame.
              - obj:
                  id: countdown_bar
                  align: TOP_LEFT
                  x: 0
                  y: 72
                  width: 480
                  height: 6
                  radius: 0
                  bg_color: ${color_text}
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
              - label:
                  id: lbl_footer
                  text: "connecting..."
                  align: BOTTOM_MID
                  y: -16
                  width: 440
                  long_mode: WRAP
                  text_align: CENTER
                  text_color: ${color_text_dim}
                  text_font: montserrat_20

    # --- Settings page ------------------------------------------------------
    # Two settings:
    #  - Result screen time: how long a result screen stays up. The Undo button
    #    is offered for the same span, so this is also the undo window. The value
    #    is published on RELEASE (not while dragging) so the broker isn't flooded.
    #  - Screen timeout: how long the backlight stays on with nothing happening.
    #    Local to the Indicator; nothing is published.
    - id: settings_page
      bg_color: ${color_bg}
      bg_opa: COVER
      widgets:
        # Same Basil + leaf header banner as the main page (no buttons here;
        # "Done" below is the way back).
        - obj:
            x: 0
            y: 0
            width: 480
            height: 72
            radius: 0
            bg_color: ${color_bg_dark}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  text: "Basil"
                  x: 24
                  align: LEFT_MID
                  text_color: ${color_text}
                  text_font: montserrat_28
              - image:
                  src: basil_leaf
                  x: 128
                  align: LEFT_MID
        - label:
            text: "Settings"
            align: TOP_MID
            y: 88
            text_color: ${color_text}
            text_font: font_bold_28
        - label:
            text: "Result screen time"
            align: TOP_MID
            y: 140
            text_color: ${color_text_dim}
            text_font: montserrat_20
        - label:
            id: lbl_setting_value
            text: "5 s"
            align: TOP_MID
            y: 168
            text_color: ${color_text}
            text_font: montserrat_28
        # 2-10 s in 1 s steps, matching the Basil app's Auto-Reset Delay slider.
        # pi/basil_capture/display.py clamps to the same range.
        - slider:
            id: settings_slider
            align: TOP_MID
            y: 212
            width: 360
            height: 24
            min_value: 2
            max_value: 10
            value: 5
            indicator:
              bg_color: ${color_success}
            knob:
              bg_color: ${color_text}
              pad_all: 10
            on_value:
              then:
                - lvgl.label.update:
                    id: lbl_setting_value
                    text:
                      format: "%.0f s"
                      args: ['x']
                - script.execute: settings_autoclose
            on_release:
              then:
                - lambda: 'id(result_sec_setting) = (int) x;'
                - mqtt.publish:
                    topic: ${result_sec_topic}
                    payload: !lambda 'return std::to_string(id(result_sec_setting));'
                    retain: true
        - label:
            text: "Screen timeout"
            align: TOP_MID
            y: 260
            text_color: ${color_text_dim}
            text_font: montserrat_20
        - label:
            id: lbl_timeout_value
            text: "1 min"
            align: TOP_MID
            y: 288
            text_color: ${color_text}
            text_font: montserrat_28
        # Seven presets (15 s, 30 s, 1 min, 2 min, 5 min, 10 min, Never); the
        # slider value is the index. Same table as screen_sleep and on_boot.
        - slider:
            id: timeout_slider
            align: TOP_MID
            y: 332
            width: 360
            height: 24
            min_value: 0
            max_value: 6
            value: 2
            indicator:
              bg_color: ${color_success}
            knob:
              bg_color: ${color_text}
              pad_all: 10
            on_value:
              then:
                - lvgl.label.update:
                    id: lbl_timeout_value
                    text: !lambda |-
                      static const char* const names[] = {"15 s", "30 s", "1 min", "2 min", "5 min", "10 min", "Never"};
                      int i = (int) x;
                      if (i < 0) i = 0;
                      if (i > 6) i = 6;
                      return std::string(names[i]);
                - script.execute: settings_autoclose
            on_release:
              then:
                - lambda: 'id(screen_timeout_idx) = (int) x;'
                # Restart the countdown so the new timeout applies right away.
                - script.execute: screen_sleep
        - button:
            id: btn_settings_done
            align: BOTTOM_MID
            y: -28
            width: 200
            height: 56
            radius: 28
            bg_color: ${color_text}
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            on_click:
              then:
                - lvgl.page.show: main_page
            widgets:
              - label:
                  text: "Done"
                  align: CENTER
                  text_color: ${color_badge_text}
                  text_font: montserrat_28

# --- Screen refresh logic ---------------------------------------------------
script:
  - id: refresh_screen
    then:
      # Fonts are fixed in the widget definitions: lbl_title is bold
      # (font_bold_28), lbl_body is regular (montserrat_28).
      - lambda: |-
          // Helper: show or hide all eight bracket bars (the scanner reticle).
          auto set_brackets = [](bool visible) {
            lv_obj_t* bars[] = {
              id(br_tl_h), id(br_tl_v), id(br_tr_h), id(br_tr_v),
              id(br_bl_h), id(br_bl_v), id(br_br_h), id(br_br_v)
            };
            for (auto* b : bars) {
              if (visible) lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN);
              else         lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
            }
          };

          // Helper: the top-right slot holds either "Settings" (idle) or "Undo"
          // (a success the Pi can undo) - never both, and nothing while
          // scanning, on errors, or while the Pi is offline.
          auto set_header_buttons = [](bool settings, bool undo) {
            if (settings) lv_obj_clear_flag(id(btn_settings), LV_OBJ_FLAG_HIDDEN);
            else          lv_obj_add_flag(id(btn_settings), LV_OBJ_FLAG_HIDDEN);
            if (undo)     lv_obj_clear_flag(id(btn_undo), LV_OBJ_FLAG_HIDDEN);
            else          lv_obj_add_flag(id(btn_undo), LV_OBJ_FLAG_HIDDEN);
          };

          // Helper: re-assert alignment after every text change. LVGL positions
          // an object once at creation; lv_label_set_text() alone does not
          // re-center it, so a stale boot layout drifts from where it belongs.
          //
          // Only status_group and the footer are aligned here. lbl_title and
          // lbl_body are flex children - the layout engine owns their position
          // and would discard any lv_obj_align() on them. Forcing them into
          // fixed center-anchored offsets is what let a two-line body grow
          // upward and cover the title.
          //
          // The group is SIZE_CONTENT, so re-aligning it after the text changes
          // re-centers whatever height the new content produced.
          // Helper: stop any running countdown and hide the bar. Killing the
          // animation matters - without it a stale anim keeps writing widths
          // to a hidden object and resumes mid-drain on the next screen.
          auto stop_countdown = []() {
            ESP_LOGD("basil", "countdown: stopped");
            lv_anim_del(id(countdown_bar), nullptr);
            lv_obj_add_flag(id(countdown_bar), LV_OBJ_FLAG_HIDDEN);
          };

          // Helper: restart the bar full-width and drain it over `ms`.
          auto start_countdown = [](uint32_t ms) {
            ESP_LOGD("basil", "countdown: draining over %ums", ms);
            lv_anim_del(id(countdown_bar), nullptr);
            lv_obj_set_width(id(countdown_bar), 480);
            lv_obj_clear_flag(id(countdown_bar), LV_OBJ_FLAG_HIDDEN);

            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, id(countdown_bar));
            lv_anim_set_exec_cb(&a, [](void* obj, int32_t v) {
              lv_obj_set_width((lv_obj_t*) obj, v);
            });
            lv_anim_set_values(&a, 480, 0);
            lv_anim_set_time(&a, ms);
            lv_anim_start(&a);
          };

          auto realign_labels = []() {
            lv_obj_update_layout(id(status_group));
            lv_obj_align(id(status_group), LV_ALIGN_CENTER,     0,  24);
            lv_obj_align(id(lbl_footer),   LV_ALIGN_BOTTOM_MID, 0, -16);
          };

          // Spinner belongs to the Starting Up screen only.
          if (id(starting_up)) lv_obj_clear_flag(id(boot_spinner), LV_OBJ_FLAG_HIDDEN);
          else                 lv_obj_add_flag(id(boot_spinner), LV_OBJ_FLAG_HIDDEN);

          // Starting up: no live "ready" from the Pi since we booted. Its
          // retained availability/status can be stale in either direction
          // while it boots, so show neither "offline" nor "Ready to Scan"
          // until it checks in or the grace runs out.
          if (id(starting_up)) {
            lv_obj_set_style_bg_color(id(bg_panel), lv_color_hex(${color_bg}), 0);
            set_brackets(false);
            set_header_buttons(false, false);
            lv_label_set_text(id(lbl_title), "Starting Up");
            lv_label_set_text(id(lbl_body), "");
            lv_obj_add_flag(id(lbl_body), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(stock_badge), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(lbl_footer), "waiting for scanner...");
            ESP_LOGI("basil", "render: starting up");
            stop_countdown();
            realign_labels();
            return;
          }

          // Broker unreachable: we can't hear the Pi at all, so whatever its
          // last message said may no longer be true. Same look as the Pi
          // offline screen; the footer says which link is down.
          if (!id(broker_up)) {
            lv_obj_set_style_bg_color(id(bg_panel), lv_color_hex(${color_bg_dark}), 0);
            set_brackets(false);
            set_header_buttons(false, false);
            lv_label_set_text(id(lbl_title), "Basil Capture");
            lv_label_set_text(id(lbl_body), "offline");
            lv_obj_clear_flag(id(lbl_body), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(stock_badge), LV_OBJ_FLAG_HIDDEN);
            ESP_LOGI("basil", "render: OFFLINE screen (MQTT broker unreachable)");
            lv_label_set_text(id(lbl_footer), "can't reach server...");
            stop_countdown();
            realign_labels();
            return;
          }

          // Pi offline overrides everything else.
          if (!id(pi_online)) {
            lv_obj_set_style_bg_color(id(bg_panel), lv_color_hex(${color_bg_dark}), 0);
            set_brackets(false);
            set_header_buttons(false, false);
            lv_label_set_text(id(lbl_title), "Basil Capture");
            lv_label_set_text(id(lbl_body), "offline");
            lv_obj_clear_flag(id(lbl_body), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(stock_badge), LV_OBJ_FLAG_HIDDEN);
            ESP_LOGI("basil", "render: OFFLINE screen (Pi unavailable)");
            lv_label_set_text(id(lbl_footer), "waiting for scanner...");
            stop_countdown();
            realign_labels();
            return;
          }

          std::string s = id(scan_status).state;
          std::string title = id(scan_title).state;
          std::string body  = id(scan_body).state;
          std::string badge = id(scan_badge).state;

          // Idle = the Basil "Ready to Scan" screen with reticle brackets.
          if (s == "idle" || s.empty()) {
            lv_obj_set_style_bg_color(id(bg_panel), lv_color_hex(${color_bg}), 0);
            set_brackets(true);
            set_header_buttons(true, false);
            lv_label_set_text(id(lbl_title), "Ready to Scan");
            // Hidden, not just emptied: an empty label is still a full line tall
            // in the flex column, which would push the title off-center.
            lv_label_set_text(id(lbl_body), "");
            lv_obj_add_flag(id(lbl_body), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(lbl_badge), "");
            lv_obj_add_flag(id(stock_badge), LV_OBJ_FLAG_HIDDEN);
            ESP_LOGI("basil", "render: idle (Ready to Scan)");
            lv_label_set_text(id(lbl_footer), "");
            stop_countdown();
            realign_labels();
            return;
          }

          // Active states: hide brackets, fill with the state color, show text.
          uint32_t color = ${color_bg};
          if      (s == "success")  color = ${color_success};
          else if (s == "error")    color = ${color_error};
          else if (s == "scanning") color = ${color_scanning};

          ESP_LOGI("basil", "render: %s | title='%s' badge='%s'",
                   s.c_str(), title.c_str(), badge.c_str());
          lv_obj_set_style_bg_color(id(bg_panel), lv_color_hex(color), 0);
          set_brackets(false);
          set_header_buttons(false, s == "success" && !id(scan_undo_id).state.empty());
          // Every optional row is hidden when empty rather than just blanked.
          // An empty label still occupies a full line in a flex column, which
          // would push the title off-center - "scanning" sends no body at all,
          // so this is the common case, not an edge case.
          lv_label_set_text(id(lbl_title), title.c_str());

          lv_label_set_text(id(lbl_body), body.c_str());
          if (body.empty()) lv_obj_add_flag(id(lbl_body), LV_OBJ_FLAG_HIDDEN);
          else              lv_obj_clear_flag(id(lbl_body), LV_OBJ_FLAG_HIDDEN);

          lv_label_set_text(id(lbl_badge), badge.c_str());
          if (badge.empty()) lv_obj_add_flag(id(stock_badge), LV_OBJ_FLAG_HIDDEN);
          else               lv_obj_clear_flag(id(stock_badge), LV_OBJ_FLAG_HIDDEN);

          lv_label_set_text(id(lbl_footer), "");

          // Only result screens time out; "scanning" sends 0 and gets no bar.
          // A new scan mid-countdown republishes and restarts this from full,
          // which is correct - the Pi's timer restarts with it.
          if (id(result_ms) > 0) start_countdown((uint32_t) id(result_ms));
          else                   stop_countdown();

          realign_labels();

  # Backlight sleep. Every wake source (scan, touch, button, Pi going offline,
  # boot) calls this, and mode: restart means each one resets the countdown.
  # The guard keeps a stale timer from blanking a result that is still on
  # screen; the "idle" message that follows a result restarts the countdown.
  # With the timeout set to Never (index 6) it does nothing, so the backlight
  # stays on; restarting it still cancels any countdown already running.
  - id: screen_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_timeout_idx) < 6;'
          then:
            - delay: !lambda |-
                static const uint32_t secs[] = {15, 30, 60, 120, 300, 600};
                int i = id(screen_timeout_idx);
                if (i < 0) i = 0;
                if (i > 5) i = 5;
                return secs[i] * 1000;
            - if:
                condition:
                  lambda: |-
                    std::string s = id(scan_status).state;
                    bool active = id(pi_online) && id(broker_up) &&
                        (s == "scanning" || s == "success" || s == "error");
                    // Stay lit while starting up so it's clear the unit is alive.
                    return !active && !id(starting_up);
                then:
                  - light.turn_off: backlight

  # Hide the Undo button when the result's countdown ends. mode: restart so a
  # newer scan's countdown replaces an older one.
  - id: undo_expire
    mode: restart
    then:
      - delay: !lambda 'return id(result_ms);'
      - lambda: 'lv_obj_add_flag(id(btn_undo), LV_OBJ_FLAG_HIDDEN);'

  # Give the Pi `startup_grace` to check in after we connect. If it hasn't by
  # then, drop out of Starting Up so the real offline screen shows.
  - id: startup_timeout
    then:
      - delay: ${startup_grace}
      - if:
          condition:
            lambda: 'return id(starting_up);'
          then:
            - lambda: |-
                ESP_LOGW("basil", "Pi did not come online within ${startup_grace}");
                id(starting_up) = false;
            - script.execute: refresh_screen
            - light.turn_on: backlight
            - script.execute: screen_sleep

  # Leave the Settings page after 30 s without touching a slider.
  - id: settings_autoclose
    mode: restart
    then:
      - delay: 30s
      - lvgl.page.show: main_page
