# Copy to config.yaml and fill in. config.yaml is gitignored (holds secrets).

grocy:
  base_url: "https://gr.example.com/api"   # your Grocy API base (ends in /api)
  api_key: "YOUR_GROCY_API_KEY"            # Grocy > Settings > Manage API keys

  # How much to consume per scan, in the product's stock unit. One scan = one
  # consume of this amount; there is no quantity entry on the device.
  consume_amount: 1

  # Maps to Grocy's "spoiled" flag on the booking. true marks everything
  # consumed here as spoiled/wasted rather than used, which is usually only
  # what you want on a dedicated bin-side scanner.
  spoil_on_consume: false

scanner:
  # Find the stable path with:  ls -l /dev/input/by-id/
  # Pick the one ending in -event-kbd for your scanner.
  device_path: "/dev/input/by-id/usb-XXXX-event-kbd"

mqtt:
  host: "192.168.1.x"          # HA / broker LAN IP (NOT the public hostname)
  port: 1883
  username: "basil-capture"    # a dedicated local Home Assistant user
  password: "CHANGE_ME"
  client_id: "basil-capture-pi"
  status_topic: "basil/capture/status"
  availability_topic: "basil/capture/availability"

behavior:
  # HTTP timeout for a single Grocy request. Note that one scan makes TWO
  # requests - the consume POST, then a GET for the product name and remaining
  # stock - and this applies to each. A fully unresponsive Grocy therefore
  # leaves "Identifying product..." on screen for up to twice this value
  # before an error appears.
  consume_timeout_sec: 5

  # Shortest barcode accepted. Anything shorter is discarded rather than sent
  # to Grocy, which filters out stray keypresses and partial reads. Raise it if
  # you get spurious scans; lower it if you have genuinely short codes.
  scan_min_length: 4

  # How long success/error stays on screen before returning to "Ready to Scan".
  # Also drives the Indicator's countdown bar, which drains over exactly this
  # span - change it here only, the firmware has no duration of its own and
  # needs no reflash.
  #
  # The wait is interruptible: scanning during it cuts the result screen short
  # and processes the new item immediately, so a longer value does not slow
  # down back-to-back scanning.
  result_display_sec: 5
