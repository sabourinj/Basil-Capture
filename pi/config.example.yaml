# Copy to config.yaml and fill in. config.yaml is gitignored (holds secrets).

grocy:
  base_url: "https://gr.example.com/api"   # your Grocy API base (ends in /api)
  api_key: "YOUR_GROCY_API_KEY"            # Grocy > Settings > Manage API keys

  # How much to consume per scan, in the product's stock unit. One scan = one
  # consume of this amount; there is no quantity entry on the device.
  consume_amount: 1

  # Maps to Grocy's "spoiled" flag on the booking. true marks everything
  # consumed here as spoiled/wasted rather than used, which is usually only
  # what you want on a dedicated bin-side scanner.
  spoil_on_consume: false

scanner:
  # How the scanner talks to the Pi:
  #   hid  USB HID Keyboard mode (the scanner's factory default). One-way: the
  #        Pi can't make it beep. device_path is an evdev node:
  #          ls -l /dev/input/by-id/     -> the one ending in -event-kbd
  #   ssi  Zebra/Symbol "SSI over USB CDC" mode (scan that setup barcode from
  #        your scanner's Product Reference Guide). Two-way: the Pi sounds a
  #        distinct beep for each outcome below. device_path is a serial port:
  #          ls -l /dev/serial/by-id/    -> the Zebra/Symbol entry
  mode: hid
  device_path: "/dev/input/by-id/usb-XXXX-event-kbd"
  # device_path: "/dev/serial/by-id/usb-Zebra_Technologies_..._if00"   # ssi

  # ssi mode only: which tone plays for each outcome. Leave this whole block
  # out to use these defaults. Use a name below, a raw SSI code 0-26, or null
  # for silence. The scanner always gives its own beep when it decodes, so
  # success defaults to silence - no error tone is the success signal.
  #   1..5_short_high  1..5_short_low  1..5_long_high  1..5_long_low
  #   fast_warble  slow_warble  high_low  low_high  high_low_high
  #   low_high_low  high_high_low_low
  # Try them on the scanner with:  ./venv/bin/python ../tools/test_beep.py
  beeps:
    ready: low_high            # service started
    success: null              # consumed
    error: 3_short_high        # Grocy refused it: unknown barcode, out of stock
    server_error: fast_warble  # Grocy unreachable / timed out
    rejected: 3_short_high     # not a product code (e.g. a URL QR code)
    undo: high_low             # undo succeeded
    undo_error: 3_short_high   # undo failed

mqtt:
  host: "192.168.1.x"          # HA / broker LAN IP (NOT the public hostname)
  port: 1883
  username: "basil-capture"    # a dedicated local Home Assistant user
  password: "CHANGE_ME"
  client_id: "basil-capture-pi"
  status_topic: "basil/capture/status"
  availability_topic: "basil/capture/availability"

behavior:
  # HTTP timeout for a single Grocy request. Note that one scan makes TWO
  # requests - the consume POST, then a GET for the product name and remaining
  # stock - and this applies to each. A fully unresponsive Grocy therefore
  # leaves "Identifying product..." on screen for up to twice this value
  # before an error appears.
  consume_timeout_sec: 5

  # Shortest barcode accepted. Anything shorter is discarded rather than sent
  # to Grocy, which filters out stray keypresses and partial reads. Raise it if
  # you get spurious scans; lower it if you have genuinely short codes.
  scan_min_length: 4

  # Scans matching any of these regexes (case-insensitive) are rejected: never
  # sent to Grocy, and shown on the Indicator as a "Not a product code" error.
  # Leave this out to use the default below, which rejects URL QR codes such as
  # the "SmartLabel" codes printed next to UPCs. Setting it replaces the
  # default, so keep these two lines if you add your own.
  reject_patterns:
    - '^[a-z][a-z0-9+.-]*://'   # anything with a scheme: https://, http://, ...
    - '^www\.'                  # bare www.example.com

  # How long success/error stays on screen before returning to "Ready to Scan".
  # Also drives the Indicator's countdown bar, which drains over exactly this
  # span - change it here only, the firmware has no duration of its own and
  # needs no reflash.
  #
  # The wait is interruptible: scanning during it cuts the result screen short
  # and processes the new item immediately, so a longer value does not slow
  # down back-to-back scanning.
  result_display_sec: 5
